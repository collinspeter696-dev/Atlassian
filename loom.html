<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loom</title>
    <link rel="stylesheet" href="./non-profit.css">
</head>
<body class="tools-frame-body">
    <div class="tools-content">
        <div class="tools-text">
            <div class="tools-product">
                <div class="product-icon">
                    <img src="./Image/Loom-icon.webp" alt="Loom icon" />
                </div>
                <div class="product-info">
                    <h3>Record and share video messages</h3>
                    <p class="product-label">Loom</p>
                    <p>Record videos to bring clarity and context to <br>your work that docs, emails, and messages <br>alone often miss - the benefits of human <br>sharing without requiring mandatory meetings.</p>
                    <p class="use-label">Watch a demo:</p>
                    <a href="#" class="explore-link">Loom for Nonprofits</a>
                    <a href="#" class="btn-outline-blue">Try Loom</a>
                </div>
            </div>
        </div>
        <div class="tools-image">
            <img src="./Image/loom-img.webp" alt="What is Loom - Atlassian Answered" />
        </div>
    </div>
</body>
</html>
